name: Selftest

# No path filter: `selftest` is the required check of the main ruleset, so it must always report.
on:
  pull_request:
    # edited: a fixed title or body reruns the pull request gate (#21)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read          # the design approval gate reads the PR's issue (#26)
  pull-requests: read

jobs:
  selftest:
    name: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the selftest takes about 2; a hang must not run for the 6 hours GitHub allows (#98)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 or later runs the vendored safety guard (#20)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: 1.13.229
          clj-kondo: 2026.10.26
          zprint: 1.3.0

      - name: Lint
        run: |
          shellcheck -S warning claude/hooks/*.sh clojure/zprint_check.sh githooks/pre-commit githooks/pre-push test/selftest.sh test/e2e.sh test/fake-gh/gh managed/pretooluse.sh
          clj-kondo --fail-level error --lint bin/kit bin/flow.clj claude/hooks/guard.clj

      - name: Selftest
        run: test/selftest.sh

      - name: Pull request gate (ADR-0002, #26, #21)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # The branch comes from GITHUB_HEAD_REF: a branch name in the script could inject commands.
        run: bb bin/kit gate --pr "${{ github.event.pull_request.number }}"
